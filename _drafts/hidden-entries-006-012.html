          <p class="block">Im weiteren Verlauf entwickelte ich ein erstes Interface-Konzept, das die Besucher:innen
            gezielt zur
            Interaktion mit der Installation einladen sollte. Geplant war ein Startbildschirm mit der Aufforderung „Come
            closer“, begleitet von einer sich langsam verändernden organischen Form im Hintergrund. Diese Bewegung
            sollte einen ruhigen „Idle-Modus“ erzeugen und den Eindruck vermitteln, dass die Installation auf eine
            Person wartet, ohne dabei vollständig statisch zu wirken.</p>

          <p class="block">Parallel dazu entstand eine zweite Variante des Startbildschirms. Im Gegensatz zur ersten
            Version war das
            Layout spielerischer gestaltet und orientierte sich gestalterisch an Startbildschirmen von Videospielen. Als
            zentrales Element diente ein Spiegel, der sinnbildlich für den Übergang in einen digitalen Spiegelraum
            stehen sollte. Der dargestellte Spiegel war bewusst analog gestaltet und bildete den Kontrast zu der
            digitalen Selbstbetrachtung, die die Besucher:innen im weiteren Verlauf der Installation erwartet.</p>

          <p class="block">Die Installation war als Abfolge von drei Bildschirmen konzipiert. Nach dem Startbildschirm
            sollte ein
            Livebild mit Scanlines erscheinen, um eine Distanz zum klassischen Spiegelbild zu schaffen und den Eindruck
            einer Kameraübertragung zu verstärken. Anschließend sollte das Gesicht durch ein Raster analysiert und
            einzelne Gesichts- und Körperpartien hervorgehoben werden. Ziel war es, den Eindruck einer technischen
            Analyse zu erzeugen und die Reduktion einer Person auf einzelne Merkmale erfahrbar zu machen. Die
            Besucher:innen sollten sich dadurch zunehmend als Objekt einer digitalen Betrachtung wahrnehmen.</p>

          <p class="block">Im Feedback zeigte sich jedoch, dass der Startbildschirm möglicherweise eine unnötige
            Vermittlungsebene
            darstellt. Statt die Besucher:innen aktiv zum Näherkommen aufzufordern, entstand die Überlegung, dass
            bereits ein übertragener Webcam-Feed ausreichend Neugier erzeugt und Menschen von selbst dazu bewegt, mit
            ihrem eigenen Bild zu interagieren. Dadurch würde die Installation unmittelbarer beginnen und die
            Selbstbeobachtung nicht durch eine textliche Aufforderung, sondern durch die natürliche Reaktion auf das
            eigene Bild ausgelöst werden. Diese Erkenntnis führte dazu, den Einstieg der Installation zu vereinfachen
            und den Fokus stärker auf die direkte Erfahrung der Besucher:innen zu legen.</p>

        </article>

          <p class="block">Im Verlauf des Projekts wurden verschiedene Kamerasysteme getestet, um die passende
            technische und gestalterische Umsetzung für die Installation zu finden. Zunächst fiel die Wahl auf die Apple
            iSight (2003), da ihre reduzierte Form an klassische Überwachungskameras erinnert und sich gestalterisch gut
            in das Konzept einfügte. Bei der Umsetzung zeigte sich jedoch, dass die Kamera aufgrund ihres veralteten
            FireWire-Anschlusses auf aktuellen Computern nur mit mehreren Adaptern und erheblichem Softwareaufwand
            betrieben werden kann. Eine zuverlässige Nutzung hätte den Einsatz älterer Apple-Hardware erfordert und den
            technischen Aufbau der Installation unnötig verkompliziert. Aus diesem Grund wurde die iSight trotz ihrer
            gestalterischen Qualität verworfen.</p>

          <p class="block">Anschließend wurde ein JVC-Camcorder getestet. Dieser konnte wegen eines Defekts des
            Condensation Sensors, der fälschlicherweise Feuchtigkeit erkannte und die Kamera sperrte, nicht verwendet
            werden. Da sich dieser Fehler nur mit erheblichem Aufwand beheben lässt, wurde auch diese Option
            ausgeschlossen.</p>

          <p class="block">Schließlich entschied ich mich bewusst für moderne HD-Webcams. Sie sind technisch zuverlässig
            und unterstützen das Konzept der Installation, da sie an die Bildsprache heutiger Smartphones, Laptops und
            Überwachungssysteme anknüpfen. Dadurch wird Self Surveillance als gegenwärtiges Phänomen erfahrbar und nicht
            als historischer Rückblick auf ältere Überwachungstechnologien.</p>
        </article>

        <div class="pagenr">- 7 -</div>
      </div>
    </section>

          <p class="block">Parallel zu der technischen Entwicklung entstand auch ein erster Ansatz des Raumkonzepts, der
            sich an einem Überwachungsraum orientierte. Ziel war es, eine abgeschlossene Umgebung zu schaffen, in der
            die Besucher:innen unmittelbar zum Mittelpunkt der Kameras werden und sich ihrer eigenen Beobachtung bewusst
            werden. Der Sketch diente zunächst dazu, die räumliche Anordnung der Kameras, Bildschirme und des
            Besucherbereichs zu visualisieren.</p>

          <p class="block"> Erst beim Aufbau der Installation zeigte sich, wie sich die räumliche Wirkung tatsächlich
            verändert. Dabei
            entstand die Erkenntnis, dass die Kameras deutlich näher an die Besucher:innen heranrücken müssen. Anstatt
            sie frei im Raum zu platzieren, wurden sie direkt neben, beziehungsweise hinter den Bildschirmen
            positioniert. Durch diese Nähe und Perspektive entsteht ein unmittelbares Gefühl der Beobachtung, da die
            Kameras ständig im Sichtfeld bleiben und sich die Besucher:innen ihrem eigenen Bild kaum entziehen können.
          </p>

          <p class="block">Diese Anpassung verstärkte die Intimität der Installation und rückte die Erfahrung von
            Überwachung
            stärker in den Mittelpunkt. Die externen Kameras vermittelten eher ein Gefühl von äußerer Überwachung als
            von Selbstüberwachung. Aus diesem Grund entschied ich mich, die Webcam wieder als zentrales Element
            einzusetzen, da sie das Prinzip der Selbstbeobachtung in Echtzeit direkter abbildet und damit näher an der
            Idee des digitalen Spiegels liegt.</p>

        </article>

          <p class="block">An diesem Punkt wechselte ich von TouchDesigner zu einer Umsetzung mit Code, da ich die Idee
            weiterverfolgte, einzelne Gesichtspartien separat zu erfassen, abzuspeichern und zu kategorisieren. Dabei
            griff ich auf frühere Experimente mit der ml5 Library zurück, wodurch sich die Umsetzung schneller und
            direkter realisieren liess. Die Fragmentierung des Gesichts folgt dabei einer Logik der selektiven
            Bildwahrnehmung: Statt das Gesicht als Ganzes zu betrachten, werden einzelne Bereiche isoliert und separat
            verarbeitet. Diese Aufteilung entspricht einer medialen Praxis der Aufmerksamkeitslenkung, in der Körper und
            Gesicht nicht als Ganzes erscheinen, sondern über Detailausschnitte strukturiert werden.</p>

          <p class="block">Im filmischen Bild, insbesondere in konventionalisierten Bildsprachen wie dem Hollywood-Kino,
            wird der
            Körper ebenfalls häufig in Fragmente zerlegt, etwa durch Close-ups oder isolierte Detailaufnahmen. Diese
            Bildlogik trägt zur Objektifizierung bei, da nicht der ganze Mensch, sondern einzelne, hervorgehobene Teile
            sichtbar und bewertbar werden. Übertragen auf das System der Selbstüberwachung bedeutet das, dass auch hier
            bestimmte Gesichtspartien stärker in den Fokus geraten und dadurch gezielt kontrolliert und bewertet werden
            können.</p>

        </article>

          </figure>

          <p class="block">Das finale Konzept der Installation besteht aus einem dreiteiligen Bildschirm-Setup, das an
            einen
            klassischen Dreifachspiegel erinnert. Eine Person betritt den Raum allein und setzt sich vor die
            Installation. Drei Kameras erfassen gleichzeitig unterschiedliche Perspektiven des Gesichts und übertragen
            diese in Echtzeit auf die gegenüberliegenden Bildschirme. Anstelle eines gewohnten Spiegelbilds entsteht so
            eine digitale Rekonstruktion des Dreifachspiegels, in der sich die Besucher:innen aus mehreren Blickwinkeln
            gleichzeitig beobachten.</p>

          <p class="block">Der Spiegel dient dabei als vertrautes analoges Modell der Selbstbetrachtung. Die Webcams
            übertragen dieses Prinzip in den digitalen Raum und werden zu einem zeitgenössischen Spiegel, der nicht nur
            reflektiert, sondern gleichzeitig aufzeichnet und speichert. Dadurch verschiebt sich die
            Funktion des Spiegels von der reinen Selbstbetrachtung hin zu einem System der digitalen Selbstüberwachung.
          </p>

          <p class="block">In unregelmäßigen Abständen wird die Liveübertragung durch einen kurzen Blitz unterbrochen,
            der eine Aufnahme markiert. Anschließend werden einzelne Gesichtspartien erfasst, kategorisiert und als
            Fragmente in einem digitalen Archiv gespeichert. Die Besucher:innen haben keinen Einfluss darauf, welcher
            Moment festgehalten wird, wie sie dargestellt werden oder welche Bilder bestehen bleiben. Im Gegensatz zu
            sozialen Medien oder Smartphone-Kameras können die entstandenen Aufnahmen weder ausgewählt noch gelöscht
            werden. Dadurch verlieren sie die Kontrolle über ihr eigenes Bild und werden mit einem zentralen Mechanismus
            der Selbstüberwachung konfrontiert: der permanenten Beobachtung bei gleichzeitiger Illusion von Kontrolle
            über das eigene Erscheinungsbild.</p>

          <p class="block">Auf dem mittleren Bildschirm, der die Frontalansicht zeigt, wird das Livebild in
            unregelmäßigen Abständen gespiegelt. Da Menschen ihr Gesicht im Alltag vor allem im Spiegel wahrnehmen,
            digitale Kamerabilder jedoch meist ungespiegelt erscheinen, erzeugt dieser Wechsel kurze Momente der
            Irritation. Das vertraute Selbstbild kippt kurzzeitig und wirkt ungewohnt. Diese gezielte Verschiebung
            unterbricht die kontinuierliche Selbstbetrachtung und macht sichtbar, wie stark die Wahrnehmung des eigenen
            Gesichts von der jeweiligen Darstellungsform abhängig ist.</p>

          <p class="block">Die Installation überträgt alltägliche Formen digitaler Selbstbeobachtung in den physischen
            Raum. Sie macht erfahrbar, wie der Blick auf das eigene Bild zunehmend durch digitale Systeme vermittelt
            wird und wie sich Mechanismen des Beobachtens, Bewertens und Archivierens in die Selbstwahrnehmung
            einschreiben.</p>

          <p class="block">Sie adressiert Personen, die regelmäßig soziale Medien nutzen und dort kontinuierlich mit
            normierten und idealisierten Darstellungen von Körper und Gesicht konfrontiert sind. Sie setzt damit an
            einer
            alltäglichen Form visueller Vergleichsprozesse an, in der Selbstwahrnehmung stark durch externe Bildlogiken
            geprägt wird.</p>

        </article>

        <div class="pagenr">- 10 -</div>
      </div>
    </section>

          <p class="block">Das Interface der Installation wurde erweitert und besteht nun aus drei aufeinanderfolgenden
            Phasen. Der Ablauf startet automatisch, sobald eine Person durch die Gesichtserkennung erfasst wird. In der
            ersten Phase wird der Webcam-Feed in unregelmässigen Abständen gespiegelt, wodurch die gewohnte
            Selbstwahrnehmung kurzzeitig irritiert wird.</p>

          <p class="block">In der zweiten Phase erscheint auf der rechten Seite ein Archiv. Gleichzeitig werden einzelne
            Gesichtszüge
            im Webcam-Feed mithilfe dynamischer Rahmen markiert und fortlaufend im Archiv gespeichert. Mit der Zeit
            beginnen sich die Rahmen zu überlagern und verdichten sich zu einer immer komplexeren visuellen Struktur.
          </p>

          <p class="block">Diese Überlagerungen werden in der dritten Phase übernommen. Die markierten Rahmen werden nun
            mit
            entsprechenden Gesichtsausschnitten anderer Personen gefüllt. Parallel dazu erscheinen auf der linken Seite
            der Website die vollständigen Bilder, aus denen die jeweiligen Gesichtsausschnitte stammen. Dadurch setzt
            sich das eigene Gesicht schrittweise aus fremden Gesichtsmerkmalen zusammen, während gleichzeitig deren
            Ursprung sichtbar gemacht wird.</p>

        </article>
